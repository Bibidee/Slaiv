name: Permissionless v3 CI

on:
  push:
    branches: [permissionless-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_GENLAYER_NETWORK: studionet
          NEXT_PUBLIC_GENLAYER_RPC_URL: https://studio.genlayer.com/api
          NEXT_PUBLIC_SLAIV_CLAIMS_ADDRESS: '0x0000000000000000000000000000000000000000'
          NEXT_PUBLIC_SLAIV_RELEASE: permissionless-v3-ci

  direct-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest 'git+https://github.com/genlayerlabs/genlayer-testing-suite.git@343e3a358f9e235a93b49c60721ce7676585ff07'
      - run: pytest tests/direct -v
        env:
          GENVM_VERSION: v0.3.0-rc6
